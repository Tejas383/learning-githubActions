name: Matrix Strategy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [11, 17, 21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup nodeJS
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java-version}}

      - name: Print node version
        run: java -version
