name: Pull Request Trigger

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Display PR Information
        run: echo "Pull Request Triggered"

      - name: Show branch
        run: echo ${{github.base_ref}}

      - name: Show event type
        run: echo ${{github.event_name}}

      - name: Display branch
        run: echo ${{github.ref}}

      - name: Display Commit SHA
        run: echo ${{github.sha}}
