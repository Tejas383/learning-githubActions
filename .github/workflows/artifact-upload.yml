name: Artifact Upload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create file
        run: |
          mkdir output
          echo "hello from artifact upload" > output/report.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/
